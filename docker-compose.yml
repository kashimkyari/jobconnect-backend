version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads:storage/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/jobconnect
      - READ_REPLICA_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db-read-replica:5432/jobconnect
    depends_on:
      - db
      - db-read-replica
      - redis

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobconnect
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    command: >
      postgres -c 'max_wal_senders=10' -c 'wal_level=replica' -c 'hot_standby=on'

  db-read-replica:
    image: postgres:13
    depends_on:
      - db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobconnect
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5432"
    command: >
      bash -c "
        until pg_isready -h db -p 5432 -U postgres; do
          echo 'Waiting for primary database...';
          sleep 2;
        done;
        rm -rf /var/lib/postgresql/data/*;
        pg_basebackup -h db -p 5432 -U postgres -D /var/lib/postgresql/data -Fp -Xs -R;
        exec postgres;
      "

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  uploads:
