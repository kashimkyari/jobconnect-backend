name: CD - Staging Deploy

on:
  push:
    branches: [ "staging" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build & Push Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/jobconnect-backend:staging .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}/jobconnect-backend:staging

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}/jobconnect-backend:staging
            docker stop jobconnect-staging || true
            docker rm jobconnect-staging || true
            docker run -d --name jobconnect-staging -p 8001:8000 \
              --env-file /home/${{ secrets.STAGING_USER }}/.env.staging \
              ghcr.io/${{ github.repository }}/jobconnect-backend:staging
